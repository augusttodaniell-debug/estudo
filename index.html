<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1622;
    --bg-deep:#060D16;
    --panel:#0F2036;
    --panel-2:#122439;
    --bezel:rgba(255,255,255,0.06);
    --grid:rgba(148,180,204,0.05);
    --ink:#E7EFF6;
    --ink-soft:#7E97AC;
    --ink-faint:#4C6178;
    --line:rgba(148,180,204,0.14);
    --phosphor:#57DDBB;
    --phosphor-dim:rgba(87,221,187,0.18);
    --amber:#F0A94E;
    --amber-dim:rgba(240,169,78,0.16);
    --red:#E2685F;
    --radius:14px;
  }

  *{box-sizing:border-box;}
  ::selection{ background:var(--phosphor-dim); }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes flicker{
    0%,100%{ opacity:1; }
    92%{ opacity:1; }
    93%{ opacity:0.85; }
    94%{ opacity:1; }
  }
  @keyframes sweep{
    from{ background-position:0 0; }
    to{ background-position:0 -560px; }
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 0 0 0 var(--phosphor-dim); }
    50%{ box-shadow:0 0 0 6px transparent; }
  }
  @keyframes needleGlow{
    0%,100%{ filter:drop-shadow(0 0 2px var(--amber)); }
    50%{ filter:drop-shadow(0 0 7px var(--amber)); }
  }

  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(87,221,187,0.06), transparent 60%),
      var(--bg-deep);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding:28px 18px 160px;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:34px 34px;
    pointer-events:none;
    z-index:0;
    mask-image:radial-gradient(ellipse 1200px 800px at 50% 0%, black 30%, transparent 85%);
  }

  .wrap{ max-width:1040px; margin:0 auto; position:relative; z-index:1; }

  /* ---------- Header / plate ---------- */
  header{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 26px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:22px;
    animation:fadeUp 0.5s ease both;
    position:relative;
    box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 20px 40px -20px rgba(0,0,0,0.5);
  }

  header::after{
    content:'';
    position:absolute; top:10px; right:14px;
    width:7px; height:7px; border-radius:50%;
    background:var(--phosphor);
    box-shadow:0 0 8px 2px var(--phosphor-dim);
    animation:pulseGlow 2.4s ease-in-out infinite;
  }

  .plate-label{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--phosphor);
    margin:0 0 6px;
    opacity:0.85;
  }

  h1{
    font-family:'Space Mono', monospace;
    font-size:23px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
    animation:flicker 7s ease-in-out infinite;
  }

  .subtitle{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:6px 0 0;
  }

  /* LED bargraph progress */
  .meter-block{ min-width:180px; }
  .meter-top{
    display:flex;
    justify-content:space-between;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:7px;
  }
  .meter-top strong{ color:var(--phosphor); font-size:15px; }

  .led-row{ display:flex; gap:3px; }
  .led{
    flex:1;
    height:10px;
    border-radius:2px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.06);
    transition:background 0.35s ease, box-shadow 0.35s ease;
  }
  .led.on{
    background:var(--phosphor);
    box-shadow:0 0 6px var(--phosphor-dim), 0 0 2px var(--phosphor);
  }

  /* ---------- Grid of day modules ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(268px, 1fr));
    gap:14px;
  }

  .day-card{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 12px;
    position:relative;
    animation:fadeUp 0.5s ease both;
    box-shadow:0 1px 0 rgba(255,255,255,0.03) inset;
    transition:border-color 0.25s ease, transform 0.25s ease;
  }

  .day-card:hover{
    border-color:rgba(148,180,204,0.3);
    transform:translateY(-2px);
  }

  .day-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    padding-bottom:10px;
    border-bottom:1px dashed var(--line);
  }

  .day-name{
    font-family:'Space Mono', monospace;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }

  .mod-tag{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:var(--ink-faint);
    border:1px solid var(--line);
    border-radius:4px;
    padding:2px 6px;
  }

  /* ---------- Item row + toggle switch ---------- */
  .item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 4px;
  }

  .switch{
    width:34px; height:18px;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    border:1px solid var(--line);
    position:relative;
    cursor:pointer;
    flex-shrink:0;
    transition:background 0.25s ease, border-color 0.25s ease;
  }

  .switch::after{
    content:'';
    position:absolute;
    top:2px; left:2px;
    width:12px; height:12px;
    border-radius:50%;
    background:var(--ink-soft);
    transition:transform 0.25s cubic-bezier(.5,-0.3,.5,1.3), background 0.25s ease;
  }

  .switch.on{
    background:var(--phosphor-dim);
    border-color:var(--phosphor);
  }
  .switch.on::after{
    transform:translateX(16px);
    background:var(--phosphor);
    box-shadow:0 0 6px var(--phosphor);
  }

  .item-label{
    flex:1;
    font-size:13.5px;
    cursor:pointer;
    user-select:none;
    transition:color 0.2s ease;
  }

  .item.done .item-label{
    color:var(--ink-faint);
    text-decoration:line-through;
  }

  .tag{
    font-family:'Space Mono', monospace;
    font-size:9.5px;
    padding:2px 6px;
    border-radius:4px;
    letter-spacing:0.03em;
    flex-shrink:0;
  }

  .tag-mat{ background:rgba(94,158,214,0.15); color:#8FC1EE; }
  .tag-fis{ background:var(--phosphor-dim); color:var(--phosphor); }
  .tag-hum{ background:var(--amber-dim); color:var(--amber); }
  .tag-rev{ background:rgba(255,255,255,0.06); color:var(--ink-soft); }
  .tag-out{ background:rgba(224,108,255,0.13); color:#D79CFF; }

  .timer-btn{
    width:24px; height:24px;
    border-radius:50%;
    border:1px solid var(--line);
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    color:var(--ink-faint);
    transition:all 0.2s ease;
  }

  .timer-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .timer-btn.active{ background:var(--amber); border-color:var(--amber); color:#1a1206; animation:pulseGlow 1.8s ease-in-out infinite; }
  .timer-btn svg{ width:11px; height:11px; }

  footer{
    max-width:1040px;
    margin:26px auto 0;
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    color:var(--ink-faint);
    text-align:center;
    letter-spacing:0.04em;
  }

  /* ---------- Timer dock ---------- */
  #dock{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    justify-content:center;
    pointer-events:none;
    padding:16px;
    z-index:5;
  }

  #dock-inner{
    pointer-events:auto;
    background:linear-gradient(180deg, #101E30, #0B1522);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:18px;
    box-shadow:0 12px 32px rgba(0,0,0,0.5);
    max-width:580px;
    width:100%;
    transform:translateY(150%);
    transition:transform 0.32s cubic-bezier(.3,.9,.4,1.2);
  }

  #dock-inner.open{ transform:translateY(0); }

  .dial{ position:relative; width:58px; height:58px; flex-shrink:0; }
  .dial svg{ width:58px; height:58px; transform:rotate(-90deg); }
  .dial-bg{ fill:none; stroke:rgba(255,255,255,0.08); stroke-width:4; }
  .dial-fg{ fill:none; stroke:var(--amber); stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
  .dial-fg.running{ animation:needleGlow 1.6s ease-in-out infinite; }
  .dial-time{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono', monospace;
    font-size:12px; font-weight:700;
  }

  .dock-info{ flex:1; min-width:0; }
  .dock-subject{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dock-meta{ font-family:'Space Mono', monospace; font-size:10.5px; color:var(--ink-soft); margin-top:3px; text-transform:uppercase; letter-spacing:0.04em; }

  .dock-controls{ display:flex; gap:6px; align-items:center; flex-shrink:0; }

  .dock-controls select{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    background:rgba(255,255,255,0.06);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:7px;
    padding:5px 6px;
  }

  .dock-btn{
    width:33px; height:33px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.05);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:all 0.2s ease;
  }

  .dock-btn:hover{ background:rgba(255,255,255,0.12); border-color:var(--phosphor); }
  .dock-btn svg{ width:13px; height:13px; }
  .dock-close{ background:transparent; border-color:transparent; color:var(--ink-faint); width:24px; height:24px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  @media (max-width:520px){
    h1{ font-size:19px; }
    header{ flex-direction:column; align-items:flex-start; }
    .meter-block{ width:100%; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <p class="plate-label">&#9679; painel ativo &mdash; 2h / dia</p>
      <h1>CRONOGRAMA DE ESTUDOS</h1>
      <p class="subtitle">TQM &middot; TQF &middot; Portugu&ecirc;s &middot; Qu&iacute;mica &middot; Ingl&ecirc;s &middot; Foguetes</p>
    </div>
    <div class="meter-block">
      <div class="meter-top"><span>PROGRESSO</span><strong id="progress-num">0/16</strong></div>
      <div class="led-row" id="led-row"></div>
    </div>
  </header>

  <div class="grid" id="grid"></div>
</div>

<footer>TOQUE NO SWITCH PRA MARCAR &middot; TOQUE NO C&Iacute;RCULO PRA CRONOMETRAR</footer>

<div id="dock">
  <div id="dock-inner">
    <div class="dial">
      <svg viewBox="0 0 58 58">
        <circle class="dial-bg" cx="29" cy="29" r="25"></circle>
        <circle class="dial-fg" id="dial-fg" cx="29" cy="29" r="25" stroke-dasharray="157" stroke-dashoffset="0"></circle>
      </svg>
      <div class="dial-time" id="dial-time">25:00</div>
    </div>
    <div class="dock-info">
      <div class="dock-subject" id="dock-subject">&mdash;</div>
      <div class="dock-meta" id="dock-meta">parado</div>
    </div>
    <div class="dock-controls">
      <select id="duration-select">
        <option value="1500">25 min</option>
        <option value="3000">50 min</option>
        <option value="3600">60 min</option>
      </select>
      <button class="dock-btn" id="dock-toggle" aria-label="Iniciar ou pausar">
        <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button class="dock-btn" id="dock-reset" aria-label="Reiniciar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button class="dock-btn dock-close" id="dock-close" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const DAYS = [
  { name: 'Segunda', items: [
    { id:'seg-mat', label:'Matem\u00e1tica \u2014 TQM', tag:'mat' },
    { id:'seg-fis', label:'F\u00edsica \u2014 TQF', tag:'fis' },
  ]},
  { name: 'Ter\u00e7a', items: [
    { id:'ter-por', label:'Portugu\u00eas \u2014 Noviss. Gram\u00e1tica', tag:'hum' },
    { id:'ter-qui', label:'Qu\u00edmica \u2014 Feltre', tag:'hum' },
  ]},
  { name: 'Quarta', items: [
    { id:'qua-mat', label:'Matem\u00e1tica \u2014 TQM', tag:'mat' },
    { id:'qua-fis', label:'F\u00edsica \u2014 TQF', tag:'fis' },
  ]},
  { name: 'Quinta', items: [
    { id:'qui-por', label:'Portugu\u00eas \u2014 Noviss. Gram\u00e1tica', tag:'hum' },
    { id:'qui-qui', label:'Qu\u00edmica \u2014 Feltre', tag:'hum' },
  ]},
  { name: 'Sexta', items: [
    { id:'sex-revex', label:'Revis\u00e3o \u2014 TQM/TQF', tag:'rev' },
    { id:'sex-revhu', label:'Revis\u00e3o \u2014 portugu\u00eas/qu\u00edmica', tag:'rev' },
  ]},
  { name: 'S\u00e1bado', items: [
    { id:'sab-ing', label:'Ingl\u00eas', tag:'out' },
    { id:'sab-fog', label:'Foguetes', tag:'out' },
  ]},
  { name: 'Domingo', items: [
    { id:'dom-sim', label:'Simulado', tag:'out' },
    { id:'dom-pal', label:'Palavra', tag:'out' },
  ]},
];

const TAG_LABEL = { mat:'MAT', fis:'FIS', hum:'HUM', rev:'REV', out:'EXT' };
const STORAGE_KEY = 'painel-estudos-checklist';

const grid = document.getElementById('grid');
const ledRow = document.getElementById('led-row');
let checkedState = {};
let currentItem = null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    checkedState = raw ? JSON.parse(raw) : {};
  }catch(e){ checkedState = {}; }
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(checkedState)); }
  catch(e){ console.error('Falha ao salvar', e); }
}

function playIcon(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg>`;
}

function renderLeds(done, total){
  ledRow.innerHTML = '';
  for(let i=0;i<total;i++){
    const led = document.createElement('div');
    led.className = 'led' + (i < done ? ' on' : '');
    ledRow.appendChild(led);
  }
}

function render(){
  grid.innerHTML = '';
  let doneCount = 0, total = 0;

  DAYS.forEach((day, di) => {
    const card = document.createElement('div');
    card.className = 'day-card';
    card.style.animationDelay = (di * 0.06) + 's';

    const head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML = `<span class="day-name">${day.name}</span><span class="mod-tag">MOD ${String(di+1).padStart(2,'0')}</span>`;
    card.appendChild(head);

    day.items.forEach(it => {
      total++;
      const isChecked = !!checkedState[it.id];
      if (isChecked) doneCount++;

      const row = document.createElement('div');
      row.className = 'item' + (isChecked ? ' done' : '');

      const sw = document.createElement('div');
      sw.className = 'switch' + (isChecked ? ' on' : '');
      sw.onclick = () => toggleCheck(it.id);

      const label = document.createElement('div');
      label.className = 'item-label';
      label.textContent = it.label;
      label.onclick = () => toggleCheck(it.id);

      const tag = document.createElement('span');
      tag.className = 'tag tag-' + it.tag;
      tag.textContent = TAG_LABEL[it.tag];

      const timerBtn = document.createElement('div');
      timerBtn.className = 'timer-btn' + (currentItem && currentItem.id === it.id ? ' active' : '');
      timerBtn.innerHTML = playIcon();
      timerBtn.onclick = () => startTimerFor(it, day.name);

      row.appendChild(sw);
      row.appendChild(label);
      row.appendChild(tag);
      row.appendChild(timerBtn);
      card.appendChild(row);
    });

    grid.appendChild(card);
  });

  document.getElementById('progress-num').textContent = `${doneCount}/${total}`;
  renderLeds(doneCount, total);
}

function toggleCheck(id){
  checkedState[id] = !checkedState[id];
  saveState();
  render();
}

// --- Timer ---
let currentDayName = '';
let remaining = 1500;
let duration = 1500;
let timerHandle = null;
let running = false;

const dockInner = document.getElementById('dock-inner');
const dockSubject = document.getElementById('dock-subject');
const dockMeta = document.getElementById('dock-meta');
const dialTime = document.getElementById('dial-time');
const dialFg = document.getElementById('dial-fg');
const iconPlay = document.getElementById('icon-play');
const iconPause = document.getElementById('icon-pause');
const durationSelect = document.getElementById('duration-select');
const CIRC = 157;

function fmt(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function updateDial(){
  dialTime.textContent = fmt(remaining);
  const frac = Math.max(0, remaining/duration);
  dialFg.setAttribute('stroke-dashoffset', String(CIRC * (1-frac)));
}

function startTimerFor(item, dayName){
  currentItem = item;
  currentDayName = dayName;
  duration = parseInt(durationSelect.value, 10);
  remaining = duration;
  running = false;
  clearInterval(timerHandle);
  dockSubject.textContent = item.label;
  dockMeta.textContent = dayName + ' \u00b7 parado';
  dialFg.classList.remove('running');
  updateDial();
  dockInner.classList.add('open');
  iconPlay.style.display = '';
  iconPause.style.display = 'none';
  render();
}

function toggleRun(){
  if (!currentItem) return;
  running = !running;
  if (running){
    iconPlay.style.display = 'none';
    iconPause.style.display = '';
    dialFg.classList.add('running');
    dockMeta.textContent = currentDayName + ' \u00b7 em andamento';
    timerHandle = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0){
        remaining = 0;
        updateDial();
        clearInterval(timerHandle);
        running = false;
        iconPlay.style.display = '';
        iconPause.style.display = 'none';
        dialFg.classList.remove('running');
        dockMeta.textContent = currentDayName + ' \u00b7 conclu\u00eddo';
        return;
      }
      updateDial();
    }, 1000);
  } else {
    clearInterval(timerHandle);
    iconPlay.style.display = '';
    iconPause.style.display = 'none';
    dialFg.classList.remove('running');
    dockMeta.textContent = currentDayName + ' \u00b7 pausado';
  }
}

document.getElementById('dock-toggle').onclick = toggleRun;
document.getElementById('dock-reset').onclick = () => {
  clearInterval(timerHandle);
  running = false;
  remaining = duration;
  iconPlay.style.display = '';
  iconPause.style.display = 'none';
  dialFg.classList.remove('running');
  dockMeta.textContent = currentDayName + ' \u00b7 parado';
  updateDial();
};
document.getElementById('dock-close').onclick = () => {
  clearInterval(timerHandle);
  running = false;
  currentItem = null;
  dockInner.classList.remove('open');
  render();
};
durationSelect.onchange = () => {
  if (!currentItem) return;
  duration = parseInt(durationSelect.value, 10);
  remaining = duration;
  clearInterval(timerHandle);
  running = false;
  iconPlay.style.display = '';
  iconPause.style.display = 'none';
  dialFg.classList.remove('running');
  dockMeta.textContent = currentDayName + ' \u00b7 parado';
  updateDial();
};

loadState();
render();
</script>
</body>
</html>
